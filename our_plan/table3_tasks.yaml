defaults:
  model:
    models: none
    decoder: true
    decoder_layer: 32
    atlas: AAL_116
    node_attr: FC
    adj_type: FC
    bold_winsize: 500
    batch_size: 128
    epochs: 200
    max_patience: 25
    lr: 0.0001
    decay: 0.0001
    hiddim: 2048
    nlayer: 4
    nhead: 8
    fc_th: 0.5
    sc_th: 0.1
    pretrained_dir: pretrain_weights_fold0/none_decoder32_ppmi-abide-taowu-neurocon-hcpa-adni-hcpya_boldwin500_FCFC
    load_dname: hcpa
  runtime:
    num_workers: 4
    seeds: [4, 44, 444]

tasks:
  abide_age:
    display_name: ABIDE age
    task_type: regression
    target_key: age
    model:
      epochs: 120
      max_patience: 18
    sample_level: subject
    split_format: crop_txt_to_subject
    id_rule: abide_file_id
    split_id_rule: abide_crop_subject
    fold_ids: [1]
    data_root: '/vePFS-0x0d/nzh/data/dataset4/DATASETS/fmri_pretraining/fmri_dataset/roi/ABIDE/AAL'
    split_source:
      train: '/vePFS-0x0d/nzh/data/dataset4/DATASETS/fmri_pretraining/fmri_dataset/roi/ABIDE/train.txt'
      val: '/vePFS-0x0d/nzh/data/dataset4/DATASETS/fmri_pretraining/fmri_dataset/roi/ABIDE/val.txt'
      test: '/vePFS-0x0d/nzh/data/dataset4/DATASETS/fmri_pretraining/fmri_dataset/roi/ABIDE/test.txt'
    label_source: '/vePFS-0x0d/nzh/data/dataset1/ningzh/labels/age/ABIDE.csv'
    label_format: csv
    label_subject_column: FILE_ID
    label_id_rule: identity
    target_column: age
    label_agg: first_non_null
    metrics: [mse, pearson_r]
    model_select_metric: val_mse
    class_map: {}

